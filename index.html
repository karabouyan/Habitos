<style>
:root{--g:#2dff7a;--r:#ff453a;--y:#ffd60a;--b:#0a84ff;--l:#2c2c2e;--m:#8e8e93}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:#000;color:#fff;font:15px/1.3 -apple-system,"SF Pro Text",system-ui,sans-serif;overscroll-behavior:none}
body{display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}

#act{display:flex;align-items:center;gap:14px}
.tx{color:var(--m);font-size:14px}.tx.on{color:var(--g)}
.plus{width:32px;height:32px;border-radius:50%;background:var(--g);color:#000;font-size:22px;line-height:32px}
#view{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding-bottom:12px}

.mu{color:var(--m);font-size:13px}
.big{font-size:84px;font-weight:200;letter-spacing:-2px;padding:12px 16px 0;line-height:1}
.big small{font-size:32px;color:var(--m);margin-left:4px;letter-spacing:0}
.sb{padding:4px 16px 16px}

.ac{display:flex;justify-content:space-between;align-items:center;gap:12px}

.ac button.g{background:var(--g);color:#000;margin-left:auto}
.sg{display:flex;gap:22px;padding:0 16px 8px}.sg button{color:var(--m);padding:8px 0;border-bottom:2px solid transparent}.sg .on{color:#fff;border-color:var(--g)}

.ch{position:relative;width:40px;height:40px;border-radius:50%;color:var(--m);font-size:14px}.ch.r{color:#fff}.ch.s{background:var(--l)}.ch.t{outline:1px solid var(--g)}
.ch i{position:absolute;left:50%;bottom:3px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%}.ch i.dn{background:var(--g)}

.xr{padding:12px 16px;border-bottom:1px solid #111}.xh{display:flex;align-items:baseline;gap:10px;margin-bottom:4px;flex-wrap:wrap}.xh b{font-weight:400;font-size:16px}
.sm{font-size:12px;margin-bottom:8px}.cs{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.o{width:44px;height:44px;border-radius:50%;border:1px solid var(--l);color:var(--m);font-size:15px}.o.on{background:var(--g);border-color:var(--g);color:#000;font-weight:600}.o.pp{animation:pop .16s}
input.kg{width:64px;margin:0;padding:8px;text-align:center;font-size:15px}.ba{color:var(--g);font-size:12px;text-decoration:none}
.xi{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid #111}.xi b{font-weight:400}.xi button{color:var(--m);padding:6px 10px}
.btn{display:block;margin:16px;padding:12px;border:1px solid var(--l);border-radius:10px;color:var(--g);text-align:center;width:calc(100% - 32px)}
select{width:100%;margin-top:6px;background:var(--l);color:#fff;border:0;border-radius:10px;padding:12px;font-size:16px}textarea{resize:none}
.sk{display:flex;align-items:flex-end;gap:2px;height:18px;margin-top:6px}.sk s{display:block;width:5px;background:var(--g);border-radius:1px}
.r4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.sp{display:flex;align-items:center;justify-content:space-between}.sp b{font-size:48px;font-weight:200}
.sp button{width:64px;height:64px;border-radius:50%;border:1px solid var(--l);font-size:28px}.pk{display:block;width:100%;text-align:left;padding:12px 0;border-bottom:1px solid var(--l)}
</style></head><body>
<header><div class="mn"><button id="pv">‹</button><span id="mt"></span><button id="nx">›</button></div><div id="act"></div></header>
<div id="view"></div>
<nav><button data-t="p">Panel</button><button data-t="h">Hábitos</button><button data-t="x">Ejercicio</button></nav>
<div id="sh"></div>
<script>
const K='ht1',$=s=>document.querySelector(s),pad=n=>String(n).padStart(2,'0');
const MES=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const ORD={r:0,y:1,b:2},td=()=>new Date();
let S;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
if(!S||!Array.isArray(S.h)||!S.l||typeof S.l!=='object')S=null;
S=S||{h:[{id:1,n:'Dormir 8 horas',p:'r',g:25,m:'',t:''},{id:2,n:'Flexiones',p:'b',g:20,m:'1 flexión',t:''},{id:3,n:'Leer',p:'y',g:20,m:'1 página',t:''}],l:{},nid:4,heavy:false};
function fx(d){d.x=d.x&&typeof d.x==='object'?d.x:{};const x=d.x,o=v=>v&&typeof v==='object'&&!Array.isArray(v)?v:{};x.ex=Array.isArray(x.ex)?x.ex.filter(e=>e&&typeof e==='object'&&e.id):[];x.rt=o(x.rt);x.ses=o(x.ses);x.au=o(x.au);x.hid=+x.hid||0;x.nid=x.nid||Math.max(0,...x.ex.map(e=>e.id))+1;return d}
S.nid=S.nid||Math.max(0,...S.h.map(h=>h.id))+1;fx(S);
let KS=null,sv_=0;const flush=()=>{if(sv_){clearTimeout(sv_);sv_=0;try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}};
const save=()=>{KS=null;if(!sv_)sv_=setTimeout(flush,150)};
addEventListener('pagehide',flush);document.addEventListener('visibilitychange',()=>{if(document.hidden)flush()});
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let tab='p',cur=new Date(td().getFullYear(),td().getMonth(),1),ed=0,ep='b';
const mk=d=>d.getFullYear()+'-'+pad(d.getMonth()+1),dim=d=>new Date(d.getFullYear(),d.getMonth()+1,0).getDate();
const isCur=()=>mk(cur)===mk(td());
const fut=d=>{const t=td(),a=cur.getFullYear()*12+cur.getMonth(),b=t.getFullYear()*12+t.getMonth();return a>b||(a===b&&d>t.getDate())};
const marks=(id,d=cur)=>((S.l[mk(d)]||{})[id])||[];
const sorted=()=>S.h.slice().sort((a,b)=>ORD[a.p]-ORD[b.p]);
const goal=(h,d=cur)=>Math.min(h.g||dim(d),dim(d));
const pct=(h,d=cur)=>Math.min(100,Math.round(marks(h.id,d).length/goal(h,d)*100));
const avg=d=>S.h.length?Math.round(S.h.reduce((a,h)=>a+pct(h,d),0)/S.h.length):0;
// vibración háptica (iOS 17.4+)
const hx=document.createElement('label');hx.style.cssText='position:fixed;opacity:0;pointer-events:none;left:-99px';hx.innerHTML='<input type="checkbox" switch>';document.body.appendChild(hx);
const haptic=()=>{try{hx.click()}catch(e){}try{navigator.vibrate&&navigator.vibrate(10)}catch(e){}};

function trk(){const n=dim(cur),t=td();let hs=sorted();if(S.heavy)hs=hs.filter(h=>h.p==='r');
let o='<div class="hd"><div class="nm"></div>';
for(let d=1;d<=n;d++)o+='<div class="dh'+(isCur()&&d===t.getDate()?' t':'')+'">'+d+'</div>';o+='</div>';
hs.forEach(h=>{const m=marks(h.id);o+='<div class="row"><div class="nm" data-h="'+h.id+'" style="border-color:var(--'+h.p+')"><b>'+esc(h.n)+'</b>'+(h.m?'<i>mín: '+esc(h.m)+'</i>':'')+'</div>';
for(let d=1;d<=n;d++)o+='<div class="c'+(m.includes(d)?' on':'')+(fut(d)?' f':'')+'" data-h="'+h.id+'" data-d="'+d+'"></div>';o+='</div>'});
if(!hs.length)o+='<p class="mu" style="padding:16px;position:sticky;left:0">Sin hábitos. Toca +</p>';return o}

function dash(){const pm=new Date(cur.getFullYear(),cur.getMonth()-1,1);
let o='<div class="big">'+avg(cur)+'<small>%</small></div><div class="sb mu">cumplimiento del mes'+(S.h.some(h=>marks(h.id,pm).length)?' · mes anterior '+avg(pm)+'%':'')+'</div>';
if(isCur()){const T=td().getDate();
sorted().filter(h=>pct(h)<100).map(h=>{const m=marks(h.id);let c=0;for(let d=T;d>=1&&!m.includes(d);d--)c++;return[h,c]}).filter(x=>x[1]>=3&&T>=3).slice(0,3)
.forEach(([h,c])=>o+='<div class="al" data-h="'+h.id+'"><b style="font-weight:400">'+esc(h.n)+'</b> · '+c+' días sin marcar<div class="mu">Toca para bajar la meta o usar la versión mínima</div></div>')}
sorted().forEach(h=>{const p=pct(h);o+='<div class="hr"><div class="t"><span><i class="dot" style="background:var(--'+h.p+')"></i>'+esc(h.n)+'</span><span class="mu">'+marks(h.id).length+'/'+goal(h)+' · '+p+'%</span></div><div class="pb"><div style="width:'+p+'%"></div></div></div>'});
return o}

// ===== EJERCICIO =====
const DN=['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'],DL=['L','M','X','J','V','S','D'];
const dk=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()),wd=d=>(d.getDay()+6)%7,tk=()=>dk(td()),cl=(v,a,b)=>Math.min(b,Math.max(a,v));
let xs='h',xd=wd(td()),xe=0,stp=null;
const ex=id=>S.x.ex.find(e=>e.id===id),sets=(k,id)=>(S.x.ses[k]||{})[id],n0=e=>e?e.r.filter(v=>v>0).length:0,keys=()=>KS||(KS=Object.keys(S.x.ses).sort());
const done=k=>{const a=S.x.ses[k];return !!a&&Object.values(a).some(e=>n0(e)>0)};
const wdate=i=>{const t=td();return new Date(t.getFullYear(),t.getMonth(),t.getDate()-wd(t)+i)};
function sync(k){const h=S.x.hid;if(!h||!S.h.some(x=>x.id===h))return;const[y,m,d]=k.split('-').map(Number),mo=y+'-'+pad(m);S.l[mo]=S.l[mo]||{};const a=S.l[mo][h]=S.l[mo][h]||[],i=a.indexOf(d);
 if(done(k)){if(i<0){a.push(d);S.x.au[k]=1}}else if(i>=0&&S.x.au[k]){a.splice(i,1);delete S.x.au[k]}}
function chips(){return '<div class="cp">'+DL.map((l,d)=>'<button data-a="day" data-d="'+d+'" class="ch'+(d===xd?' s':'')+((S.x.rt[d]||[]).length?' r':'')+(d===wd(td())?' t':'')+'">'+l+'<i class="'+(done(dk(wdate(d)))?'dn':'')+'"></i></button>').join('')+'</div>'}
const sc=(r,w)=>w>0?w*(1+r/30):r;
let PX=null,PK='';
function px(){const k=tk();if(PX&&PK===k)return PX;PX={};for(const d of keys()){if(d>=k)break;const a=S.x.ses[d];for(const id in a)if(n0(a[id]))(PX[id]=PX[id]||[]).push([d,a[id]])}PK=k;return PX}
function hist(id){const o=(px()[id]||[]).slice(),k=tk(),K=keys(),f=[];for(let i=K.length-1;i>=0&&K[i]>=k;i--){const e=S.x.ses[K[i]][id];if(e&&n0(e))f.push([K[i],e])}return o.concat(f.reverse())}
function best(id){const h=hist(id),t=td(),w7=dk(new Date(t.getFullYear(),t.getMonth(),t.getDate()-6));let b=null,pr=false;
 h.forEach(([k,e],i)=>e.r.forEach(r=>{if(r>0){const s=sc(r,e.w);if(!b||s>b.s){b={s,r,w:e.w,k};pr=i>0&&k>=w7}}}));return{b,pr,h}}
function hoy(){const k=tk(),L=(S.x.rt[xd]||[]).map(ex).filter(Boolean),tot=Object.values(S.x.ses[k]||{}).reduce((a,e)=>a+n0(e),0),dn=tot>0;
 let o=chips()+'<div class="st'+(dn?' g':'')+'">'+(dn?'Día cumplido ✓ · '+tot+' series':'1 serie cuenta como día cumplido')+'</div>';
 if(!L.length)return o+'<p class="mu pad">'+(S.x.ex.length?'Sin ejercicios este día.':'Aún no hay ejercicios.')+'</p><button class="btn" data-a="xs" data-s="r">Ir a Rutina</button>';
 let all=true;const prs=[];
 L.forEach(e=>{const s=sets(k,e.id)||{r:[]},n=Math.max(e.s,s.r.length),B=best(e.id),pv=B.h.filter(x=>x[0]<k).pop();let cs='';
  for(let i=0;i<n;i++){const v=s.r[i]>0;if(!v&&i<e.s)all=false;cs+='<button data-a="set" data-e="'+e.id+'" data-i="'+i+'" class="o'+(v?' on':'')+'">'+(v?s.r[i]:e.g)+'</button>'}
  if(B.pr&&B.b.k===k)prs.push(e.n);
  const up=pv&&e.t>0&&pv[1].r.slice(0,e.s).filter(v=>v>=e.t).length>=e.s;
  o+='<div class="xr"><div class="xh"><b data-a="ex" data-e="'+e.id+'">'+esc(e.n)+'</b><span class="mu">'+e.s+'×'+e.g+'</span>'+(e.v?'<a class="ba" href="'+esc(e.v)+'" target="_blank" rel="noopener">▶</a>':'')+(up?'<span class="ba">↑ sube carga</span>':'')+'</div>'+(pv?'<div class="mu sm">Anterior: '+pv[1].r.filter(v=>v>0).join('·')+(pv[1].w?' · '+pv[1].w+' kg':'')+'</div>':'')+'<div class="cs">'+cs+'<input class="kg" type="number" inputmode="decimal" step="any" data-e="'+e.id+'" placeholder="kg" value="'+(e.w||'')+'"></div></div>'});
 if(all)o+='<div class="st g" style="padding-top:12px">Sesión completa ✓'+(prs.length?' · Nueva marca: '+prs.map(esc).join(', '):'')+'</div>';return o}
function rut(){const L=(S.x.rt[xd]||[]).map(ex).filter(Boolean);
 let o=chips()+'<div class="st">'+DN[xd]+' · '+L.length+' ejercicio'+(L.length===1?'':'s')+(L.length>6?' · sugerido máx. 6':'')+'</div>';
 L.forEach(e=>o+='<div class="xi"><b data-a="ex" data-e="'+e.id+'">'+esc(e.n)+' <span class="mu">'+e.s+'×'+e.g+(e.gr?' · '+esc(e.gr):'')+'</span></b><button data-a="rm" data-e="'+e.id+'">✕</button></div>');
 return o+'<button class="btn" data-a="padd">+ Agregar ejercicio</button><div class="pad mu">Marcar series cuenta como el hábito:<select id="hs"><option value="0">Ninguno</option>'+S.h.map(h=>'<option value="'+h.id+'"'+(h.id===S.x.hid?' selected':'')+'>'+esc(h.n)+'</option>').join('')+'</select></div>'}
function prog(){const wk=[0,1,2,3,4,5,6].map(i=>dk(wdate(i))),pl=Object.keys(S.x.rt).filter(d=>(S.x.rt[d]||[]).length).length,dn=wk.filter(k=>done(k)).length,g={};
 wk.forEach(k=>Object.entries(S.x.ses[k]||{}).forEach(([id,e])=>{const n=n0(e);if(n){const x=ex(+id),nm=(x&&x.gr)||'Otros';g[nm]=(g[nm]||0)+n}}));
 let o='<div class="big">'+dn+'<small>/'+(pl||dn)+'</small></div><div class="sb mu">sesiones esta semana</div>';const G=Object.entries(g).sort((a,b)=>b[1]-a[1]);
 if(G.length){o+='<div class="sb mu">Series por grupo · ref. 5–10 a la semana</div>';G.forEach(([n,v])=>o+='<div class="hr"><div class="t"><span>'+esc(n)+'</span><span class="mu">'+v+'</span></div><div class="pb"><div style="width:'+Math.min(100,v*10)+'%"></div></div></div>')}
 o+='<div class="sb mu">Mejor serie</div>';let any=0;
 S.x.ex.slice().sort((a,b)=>a.n.localeCompare(b.n)).forEach(e=>{const B=best(e.id);if(!B.b)return;any=1;const t=B.h.slice(-8).map(x=>x[1].r.reduce((a,v)=>a+(v>0?v:0),0)),mx=Math.max(...t);
  o+='<div class="hr"><div class="t"><span>'+esc(e.n)+(B.pr?' <span class="ba">↑</span>':'')+'</span><span class="mu">'+B.b.r+(B.b.w?' × '+B.b.w+' kg':' reps')+'</span></div><div class="sk">'+t.map(v=>'<s style="height:'+Math.max(8,Math.round(v/mx*100))+'%"></s>').join('')+'</div></div>'});
 return o+(any?'':'<p class="mu pad">Aún sin registros.</p>')}
function xv(){const L={h:'Hoy',r:'Rutina',p:'Progreso'};return '<div class="sg">'+['h','r','p'].map(s=>'<button data-a="xs" data-s="'+s+'" class="'+(xs===s?'on':'')+'">'+L[s]+'</button>').join('')+'</div>'+(xs==='h'?hoy():xs==='r'?rut():prog())}
function rv(){const v=$('#view'),t=v.scrollTop;v.innerHTML=tab==='x'?xv():tab==='h'?trk():dash();v.scrollTop=t}
function clean(k,id){const e=sets(k,id);if(e&&!n0(e)){delete S.x.ses[k][id];if(!Object.keys(S.x.ses[k]).length)delete S.x.ses[k]}}
function tapSet(id,i){const x=ex(id);if(!x)return;const k=tk();S.x.ses[k]=S.x.ses[k]||{};const e=S.x.ses[k][id]=S.x.ses[k][id]||{r:[],w:0};
 if(e.r[i]>0)return stepper(id,i);for(let j=0;j<i;j++)if(!e.r[j])e.r[j]=0;e.r[i]=x.g;e.w=x.w||0;sync(k);save();haptic();
 const c=$('.o[data-e="'+id+'"][data-i="'+i+'"]'),rest=[...document.querySelectorAll('.o:not(.on)')].filter(z=>z!==c).length;
 if(!c||!rest||c.classList.contains('on'))rv();else{c.className='o on pp';c.textContent=x.g;const t=Object.values(S.x.ses[k]).reduce((a,z)=>a+n0(z),0),m=$('.st');if(m){m.className='st g';m.textContent='Día cumplido ✓ · '+t+' series'}}
 const c2=$('.o[data-e="'+id+'"][data-i="'+i+'"]');c2&&c2.classList.add('pp')}
function stepper(id,i){stp={id,i};const e=sets(tk(),id);$('#sh').innerHTML='<div class="bg"></div><div class="pn"><div class="mu">'+esc(ex(id).n)+' · serie '+(i+1)+'</div><div class="sp"><button data-sa="-">−</button><b id="sn">'+e.r[i]+'</b><button data-sa="+">+</button></div><div class="ac"><button data-sa="x">Quitar</button><button data-sa="ok" class="g">Listo</button></div></div>';$('#sh').classList.add('o')}
function step(a){const k=tk(),e=stp&&sets(k,stp.id);if(!e)return close();if(a==='ok')return close();
 e.r[stp.i]=a==='x'?0:cl((e.r[stp.i]||0)+(a==='+'?1:-1),0,999);
 if(!e.r[stp.i])close();else $('#sn').textContent=e.r[stp.i];
 clean(k,stp.id);sync(k);save();rv()}
function sheetEx(id){const e=id?ex(id):{n:'',gr:'',d:'',v:'',s:3,g:10,t:'',w:''};xe=id||0;
 $('#sh').innerHTML='<div class="bg"></div><div class="pn"><input id="en" placeholder="Ejercicio" value="'+esc(e.n)+'"><input id="eg" list="gl" placeholder="Grupo (opcional)" value="'+esc(e.gr)+'"><datalist id="gl">'+[...new Set(S.x.ex.map(x=>x.gr).filter(Boolean))].map(g=>'<option value="'+esc(g)+'">').join('')+'</datalist><textarea id="ed" rows="2" placeholder="Descripción / pistas de técnica">'+esc(e.d)+'</textarea><input id="ev" inputmode="url" placeholder="Link de video (opcional)" value="'+esc(e.v)+'"><div class="r4"><label>Series<input id="es" type="number" inputmode="numeric" value="'+e.s+'"></label><label>Reps<input id="er" type="number" inputmode="numeric" value="'+e.g+'"></label><label>Tope<input id="et" type="number" inputmode="numeric" value="'+(e.t||'')+'"></label><label>kg<input id="ew" type="number" inputmode="decimal" step="any" value="'+(e.w||'')+'"></label></div><div class="ac">'+(id?'<button id="xdl">Eliminar</button>':'')+'<button id="xsv" class="g">Guardar</button></div></div>';$('#sh').classList.add('o')}
function xsave(){const n=$('#en').value.trim();if(!n)return;let v=$('#ev').value.trim();if(v&&!/^https?:\/\//i.test(v))v='https://'+v;try{if(v)new URL(v)}catch(e){v=''}
 const g=cl(Math.round(+$('#er').value)||10,1,200),t=Math.round(+$('#et').value)||0,o={n:n.slice(0,60),gr:$('#eg').value.trim().slice(0,24),d:$('#ed').value.trim().slice(0,400),v:v.slice(0,300),s:cl(Math.round(+$('#es').value)||3,1,10),g,t:t>g?cl(t,1,200):0,w:cl(+$('#ew').value||0,0,999)};
 if(xe&&ex(xe))Object.assign(ex(xe),o);else{o.id=S.x.nid++;S.x.ex.push(o);(S.x.rt[xd]=S.x.rt[xd]||[]).push(o.id)}save();close();render()}
function xdel(){const id=xe;PX=null;S.x.ex=S.x.ex.filter(e=>e.id!==id);for(const d in S.x.rt)S.x.rt[d]=(S.x.rt[d]||[]).filter(x=>x!==id);
 for(const k of Object.keys(S.x.ses))if(S.x.ses[k][id]){delete S.x.ses[k][id];if(!Object.keys(S.x.ses[k]).length)delete S.x.ses[k];sync(k)}save();close();render()}
function picker(){const rest=S.x.ex.filter(e=>!(S.x.rt[xd]||[]).includes(e.id));$('#sh').innerHTML='<div class="bg"></div><div class="pn"><div class="mu">Agregar a '+DN[xd]+'</div>'+rest.map(e=>'<button class="pk" data-pe="'+e.id+'">'+esc(e.n)+'</button>').join('')+'<div class="ac"><button class="g" id="pn">Nuevo ejercicio</button></div></div>';$('#sh').classList.add('o')}
function xclick(t){const d=t.dataset;
 if(d.pe){const a=S.x.rt[xd]=S.x.rt[xd]||[];if(!a.includes(+d.pe))a.push(+d.pe);save();close();render();return true}
 if(t.id==='pn'){sheetEx(0);return true}if(d.sa){step(d.sa);return true}if(t.id==='xsv'){xsave();return true}
 if(t.id==='xdl'){if(confirm('¿Eliminar este ejercicio y su historial?'))xdel();return true}return false}
function xact(a){const d=a.dataset,id=+d.e;
 if(d.a==='xs'){xs=d.s;xd=wd(td());render()}else if(d.a==='day'){xd=+d.d;rv()}else if(d.a==='set')tapSet(id,+d.i);else if(d.a==='ex')sheetEx(id);
 else if(d.a==='rm'){S.x.rt[xd]=(S.x.rt[xd]||[]).filter(x=>x!==id);save();rv()}else if(d.a==='padd')picker()}
function render(){const isx=tab==='x';$('#mt').textContent=isx?'Ejercicio':MES[cur.getMonth()]+' '+cur.getFullYear();$('#pv').style.visibility=$('#nx').style.visibility=isx?'hidden':'visible';
$('#act').innerHTML=tab==='h'?'<button class="tx'+(S.heavy?' on':'')+'" id="hv">Semana pesada</button><button class="plus" id="add">+</button>':isx?(xs==='r'?'<button class="plus" id="xadd">+</button>':''):'<button class="tx" id="bk">Respaldo</button>';
document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
const v=$('#view');v.innerHTML=isx?xv():tab==='h'?trk():dash();
if(tab==='h'&&isCur())v.scrollLeft=Math.max(0,(td().getDate()-4)*36)}

function warn(){const n=S.h.filter(h=>h.p==='b'&&h.id!==ed).length;$('#wn').textContent=ep==='b'&&n>=2?'Ya tienes '+n+' en construcción. Considera esperar a que uno se consolide.':''}
function sheet(id){const h=id?S.h.find(x=>x.id===id):{n:'',p:'b',g:20,m:'',t:''};ed=id||0;ep=h.p;
$('#sh').innerHTML='<div class="bg"></div><div class="pn"><input id="fn" placeholder="Hábito" value="'+esc(h.n)+'"><div class="pr">'+
[['r','No negociable'],['y','Importante'],['b','En construcción']].map(([k,l])=>'<button data-p="'+k+'" class="'+(h.p===k?'s':'')+'" style="--c:var(--'+k+')">'+l+'</button>').join('')+
'</div><div id="wn" class="mu"></div><label>Meta: días al mes<input id="fg" type="number" inputmode="numeric" min="1" max="31" value="'+(h.g||'')+'"></label><label>Versión mínima (cuenta como hecho)<input id="fm" placeholder="Ej. 1 flexión" value="'+esc(h.m)+'"></label><label>Después de…<input id="ft" placeholder="Ej. al servirme el café" value="'+esc(h.t)+'"></label><div class="ac">'+(id?'<button id="dl">Eliminar</button>':'')+'<button id="sv" class="g">Guardar</button></div></div>';
$('#sh').classList.add('o');warn()}
function backup(){$('#sh').innerHTML='<div class="bg"></div><div class="pn"><label>Respaldo de tus datos<textarea id="tx" rows="6">'+esc(JSON.stringify(S))+'</textarea></label><div class="ac"><button id="rs" style="color:#fff">Restaurar</button><button id="cp" class="g">Copiar</button></div></div>';$('#sh').classList.add('o')}
const close=()=>$('#sh').classList.remove('o');

$('#sh').onclick=e=>{const t=e.target;
if(t.classList.contains('bg'))return close();if(xclick(t))return;
if(t.dataset.p){ep=t.dataset.p;document.querySelectorAll('.pr button').forEach(b=>b.classList.toggle('s',b===t));warn()}
if(t.id==='sv'){const n=$('#fn').value.trim();if(!n)return;const o={n,p:ep,g:Math.min(31,+$('#fg').value||0),m:$('#fm').value.trim(),t:$('#ft').value.trim()};
if(ed)Object.assign(S.h.find(x=>x.id===ed),o);else{o.id=S.nid++;S.h.push(o)}save();close();render()}
if(t.id==='dl'&&confirm('¿Eliminar este hábito y su historial?')){S.h=S.h.filter(x=>x.id!==ed);for(const k in S.l)delete S.l[k][ed];save();close();render()}
if(t.id==='cp'){navigator.clipboard.writeText($('#tx').value).then(()=>t.textContent='Copiado').catch(()=>$('#tx').select())}
if(t.id==='rs'){try{const d=JSON.parse($('#tx').value);if(!d||!Array.isArray(d.h)||!d.l||typeof d.l!=='object')throw 0;d.nid=d.nid||Math.max(0,...d.h.map(h=>h.id))+1;fx(d);if(confirm('¿Reemplazar los datos actuales?')){S=d;PX=null;save();close();render()}}catch(x){alert('Respaldo no válido')}}};

$('#view').onchange=e=>{const t=e.target;if(t.classList.contains('kg')){const x=ex(+t.dataset.e);if(x){x.w=cl(+t.value||0,0,999);save()}}else if(t.id==='hs'){S.x.hid=+t.value;save()}};
$('#view').onclick=e=>{const a=e.target.closest('[data-a]');if(a)return xact(a);const t=e.target.closest('[data-h]');if(!t)return;const id=+t.dataset.h;
if(t.classList.contains('c')){const k=mk(cur),d=+t.dataset.d;if(fut(d))return;S.l[k]=S.l[k]||{};const a=S.l[k][id]=S.l[k][id]||[];const i=a.indexOf(d);i<0?a.push(d):a.splice(i,1);save();t.classList.toggle('on',i<0);if(i<0)haptic()}
else sheet(id)};
$('#act').onclick=e=>{const i=e.target.id;if(i==='add')sheet(0);if(i==='xadd')sheetEx(0);if(i==='bk')backup();if(i==='hv'){S.heavy=!S.heavy;save();render()}};
$('#pv').onclick=()=>{cur=new Date(cur.getFullYear(),cur.getMonth()-1,1);render()};
$('#nx').onclick=()=>{cur=new Date(cur.getFullYear(),cur.getMonth()+1,1);render()};
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;if(tab==='x')xd=wd(td());render()});
let LK=tk();document.addEventListener('visibilitychange',()=>{if(!document.hidden){if(tk()!==LK){LK=tk();xd=wd(td());cur=new Date(td().getFullYear(),td().getMonth(),1)}render()}});
render();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
</script></body></html>
